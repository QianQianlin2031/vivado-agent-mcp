[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vivado-agent-mcp"
version = "0.1.0"
description = "An Agent-oriented MCP server for safe, observable Vivado build automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
vivado-agent-mcp = "vivado_agent_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vivado_agent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
